[package]
name = "usbtop-ng"
version = "1.5.0"
edition = "2021"
authors = ["usbtop-ng contributors"]
description = "USB bandwidth monitor for Linux with a terminal UI"
license = "BSD-3-Clause"
repository = "https://github.com/wifi-blackout/usbtop-ng"
readme = "README.md"
keywords = ["usb", "monitoring", "usbmon", "tui"]
categories = ["command-line-utilities"]
rust-version = "1.88"
exclude = ["tmp/", ".claude/", ".github/", "release.sh"]

[features]
integration = []
ebpf = ["dep:libbpf-rs", "dep:libbpf-cargo"]
# Developer/CI tooling: the `--capture-fixture` subcommand and the in-crate
# replay seams it reuses. Off by default so the shipped binary and its public
# API are unchanged.
capture-fixture = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = "0.29"
env_logger = "0.11"
libbpf-rs = { version = "0.27.0", optional = true }
libc = "0.2"
log = "0.4"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
toml = "1.1"

[dev-dependencies]
tempfile = "3.16"

[build-dependencies]
libbpf-cargo = { version = "0.27.0", optional = true }
