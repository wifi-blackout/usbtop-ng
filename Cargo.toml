[package]
name = "usbtop-ng"
version = "0.1.0"
edition = "2021"
authors = ["usbtop-ng contributors"]
description = "Next-generation USB traffic monitoring tool with a modern terminal UI"
license = "BSD-3-Clause"
repository = "https://github.com/wifi-blackout/usbtop-ng"
readme = "README.md"
keywords = ["usb", "monitoring", "usbmon", "tui"]
categories = ["command-line-utilities"]
rust-version = "1.88"

[features]
integration = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
signal-hook = "0.3"
toml = "1.1"

[dev-dependencies]
tempfile = "3.16"
