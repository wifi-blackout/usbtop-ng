name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # The default build now compiles the capture core (src/capture, src/fixture_replay) and src/diag; only --capture-fixture stays behind its feature.
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy the integration feature
        run: cargo clippy --all-targets --features integration -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Test the integration feature
        # Hermetic integration tests only. The live/privileged tests (fchown,
        # live support-bundle, live usbmon ring) self-skip without root+usbmon,
        # which this runner lacks; those are verified on the fleet, not here.
        run: cargo test --features integration

  ebpf:
    name: eBPF feature (build + hermetic tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ebpf

      - name: Install the eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev linux-tools-common linux-tools-generic

      - name: Build the ebpf feature
        run: cargo build --features ebpf

      - name: Clippy the ebpf feature
        run: cargo clippy --all-targets --features ebpf -- -D warnings

      - name: Test the ebpf feature
        run: cargo test --features ebpf

  capture-fixture:
    name: capture-fixture feature (clippy + hermetic tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: capture-fixture

      - name: Clippy the capture-fixture feature
        run: cargo clippy --features capture-fixture --all-targets -- -D warnings

      - name: Test the capture-fixture feature
        run: cargo test --features capture-fixture

  evals:
    name: Tier-1 evals (deterministic regression floor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: evals
      - name: Run the Tier-1 eval suite
        run: bash evals/run.sh
